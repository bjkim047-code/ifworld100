<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f1ea;
      --card: #ffffff;
      --ink: #1f2a37;
      --muted: #6b7280;
      --line: #e5e1d8;
      --accent: #1f7a5c;
      --accent-ink: #ffffff;
      --accent-soft: #e3f2ec;
      --warn: #b4232f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Noto Sans KR', system-ui, sans-serif;
      line-height: 1.6;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    .eyebrow {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.02em;
    }
    h1 { font-size: 28px; font-weight: 900; line-height: 1.3; margin: 4px 0 8px; }
    h2 { font-size: 22px; font-weight: 700; line-height: 1.45; margin: 8px 0 20px; word-break: keep-all; }
    p.lead { color: var(--muted); margin: 0 0 24px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 24px 20px;
    }
    label { display: block; font-weight: 500; margin: 16px 0 6px; }
    label:first-child { margin-top: 0; }
    .input-row { display: flex; align-items: center; gap: 8px; }
    input {
      width: 100%;
      font: inherit;
      font-size: 18px;
      padding: 12px 14px;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
    }
    input:focus { outline: none; border-color: var(--accent); }
    .unit { font-size: 18px; font-weight: 500; white-space: nowrap; }
    .buttons { display: flex; gap: 10px; margin-top: 24px; }
    button {
      flex: 1;
      font: inherit;
      font-size: 17px;
      font-weight: 700;
      padding: 14px;
      border-radius: 10px;
      border: 2px solid var(--accent);
      background: var(--accent);
      color: var(--accent-ink);
      cursor: pointer;
    }
    button.secondary { background: transparent; color: var(--accent); }
    button:disabled { opacity: 0.5; cursor: wait; }
    .error { color: var(--warn); font-weight: 500; min-height: 1.6em; margin: 12px 0 0; }
    .progress { display: flex; gap: 4px; margin: 8px 0 20px; }
    .progress span { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
    .progress span.done { background: var(--accent); }
    .review { list-style: none; margin: 0; padding: 0; }
    .review li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }
    .review li:last-child { border-bottom: 0; }
    .review .no { font-weight: 700; color: var(--accent); min-width: 2.5em; }
    .review .ans { flex: 1; }
    .review .sub { display: block; font-size: 14px; color: var(--muted); }
    .review button { flex: 0 0 auto; font-size: 14px; padding: 6px 12px; }
    .review .pts { font-weight: 700; white-space: nowrap; }
    .total {
      text-align: center;
      background: var(--accent-soft);
      border-radius: 16px;
      padding: 24px 16px;
      margin-bottom: 20px;
    }
    .total strong { display: block; font-size: 56px; font-weight: 900; color: var(--accent); line-height: 1.1; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <!-- 1. 접속 -->
  <section id="login">
    <div class="eyebrow">생각 열기</div>
    <h1>세계가 100명이라면</h1>
    <p class="lead" id="intro"></p>
    <form class="card" id="login-form" novalidate>
      <label for="student-id">학번</label>
      <input id="student-id" inputmode="numeric" autocomplete="off" maxlength="20" placeholder="예: 10101">
      <label for="student-name">이름</label>
      <input id="student-name" autocomplete="off" maxlength="20" placeholder="예: 홍길동">
      <p class="error" id="login-error"></p>
      <div class="buttons"><button type="submit" id="login-button">시작하기</button></div>
    </form>
  </section>

  <!-- 2. 문제 -->
  <section id="quiz" hidden>
    <div class="eyebrow" id="quiz-count"></div>
    <div class="progress" id="progress"></div>
    <form class="card" id="quiz-form" novalidate>
      <h2 id="question-text"></h2>
      <div id="fields"></div>
      <p class="error" id="quiz-error"></p>
      <div class="buttons">
        <button type="button" class="secondary" id="prev-button">이전</button>
        <button type="submit" id="next-button">다음</button>
      </div>
    </form>
  </section>

  <!-- 3. 제출 전 확인 -->
  <section id="review" hidden>
    <div class="eyebrow">마지막 확인</div>
    <h1>답을 확인해 주세요</h1>
    <p class="lead">제출하면 고칠 수 없어요.</p>
    <div class="card">
      <ul class="review" id="review-list"></ul>
    </div>
    <p class="error" id="submit-error"></p>
    <div class="buttons"><button type="button" id="submit-button">제출하기</button></div>
  </section>

  <!-- 4. 결과 -->
  <section id="result" hidden>
    <div class="eyebrow">제출 완료</div>
    <h1 id="result-title"></h1>
    <div class="total">내 점수<strong id="result-total"></strong>/ 100점</div>
    <div class="card">
      <ul class="review" id="result-list"></ul>
    </div>
  </section>
</main>

<script>
  var DATA = <?!= questionData ?>;
  var QUESTIONS = DATA.questions;
  var state = { studentId: '', name: '', index: 0, answers: QUESTIONS.map(function (q) {
    return q.fields.map(function () { return ''; });
  }) };

  function $(id) { return document.getElementById(id); }

  function show(sectionId) {
    ['login', 'quiz', 'review', 'result'].forEach(function (id) { $(id).hidden = id !== sectionId; });
    window.scrollTo(0, 0);
  }

  function storageKey() { return 'ifworld100:' + state.studentId; }

  function saveProgress() {
    try { localStorage.setItem(storageKey(), JSON.stringify({ index: state.index, answers: state.answers })); } catch (e) {}
  }

  function loadProgress() {
    try {
      var saved = JSON.parse(localStorage.getItem(storageKey()));
      if (saved && saved.answers && saved.answers.length === QUESTIONS.length) {
        state.answers = saved.answers;
        state.index = Math.min(saved.index || 0, QUESTIONS.length - 1);
      }
    } catch (e) {}
  }

  function clearProgress() {
    try { localStorage.removeItem(storageKey()); } catch (e) {}
  }

  $('intro').textContent = DATA.intro + ' 한 문제씩 생각해 보고 답을 적어 보세요.';

  // ---- 접속 ----
  $('login-form').addEventListener('submit', function (event) {
    event.preventDefault();
    var studentId = $('student-id').value.trim();
    var name = $('student-name').value.trim();
    if (!studentId || !name) {
      $('login-error').textContent = '학번과 이름을 모두 입력해 주세요.';
      return;
    }
    $('login-error').textContent = '';
    $('login-button').disabled = true;
    google.script.run
      .withSuccessHandler(function (res) {
        $('login-button').disabled = false;
        if (res.alreadySubmitted) {
          $('login-error').textContent = '이미 제출한 학번이에요. 학번을 다시 확인하거나 선생님께 말씀해 주세요.';
          return;
        }
        state.studentId = studentId;
        state.name = name;
        loadProgress();
        renderQuestion();
        show('quiz');
      })
      .withFailureHandler(function () {
        $('login-button').disabled = false;
        $('login-error').textContent = '접속에 실패했어요. 잠시 후 다시 시도해 주세요.';
      })
      .checkStudent(studentId);
  });

  // ---- 문제 ----
  function renderQuestion() {
    var q = QUESTIONS[state.index];
    $('quiz-count').textContent = '문제 ' + (state.index + 1) + ' / ' + QUESTIONS.length;
    $('progress').innerHTML = QUESTIONS.map(function (_, i) {
      return '<span class="' + (i <= state.index ? 'done' : '') + '"></span>';
    }).join('');
    $('question-text').textContent = q.text;
    $('quiz-error').textContent = '';
    $('prev-button').hidden = state.index === 0;
    $('next-button').textContent = state.index === QUESTIONS.length - 1 ? '답 확인하기' : '다음';

    var fields = $('fields');
    fields.innerHTML = '';
    q.fields.forEach(function (field, j) {
      var label = document.createElement('label');
      label.textContent = field.label;
      label.htmlFor = 'field-' + j;
      var row = document.createElement('div');
      row.className = 'input-row';
      var input = document.createElement('input');
      input.id = 'field-' + j;
      input.autocomplete = 'off';
      input.value = state.answers[state.index][j];
      if (field.type === 'number') {
        input.type = 'number';
        input.inputMode = 'numeric';
        input.min = '0';
        input.max = '100';
        input.step = '1';
        input.placeholder = '0~100';
      } else {
        input.maxLength = 30;
      }
      row.appendChild(input);
      if (field.type === 'number') {
        var unit = document.createElement('span');
        unit.className = 'unit';
        unit.textContent = '명';
        row.appendChild(unit);
      }
      fields.appendChild(label);
      fields.appendChild(row);
    });
    var first = $('field-0');
    if (first) first.focus();
  }

  function readCurrentAnswers() {
    var q = QUESTIONS[state.index];
    var values = q.fields.map(function (_, j) { return $('field-' + j).value.trim(); });
    state.answers[state.index] = values;
    saveProgress();
    for (var j = 0; j < q.fields.length; j++) {
      if (!values[j]) return '빈 칸을 모두 채워 주세요.';
      if (q.fields[j].type === 'number') {
        var n = Number(values[j]);
        if (!Number.isInteger(n) || n < 0 || n > 100) return '사람 수는 0부터 100 사이의 정수로 적어 주세요.';
      }
    }
    return '';
  }

  $('quiz-form').addEventListener('submit', function (event) {
    event.preventDefault();
    var error = readCurrentAnswers();
    if (error) { $('quiz-error').textContent = error; return; }
    if (state.index < QUESTIONS.length - 1) {
      state.index++;
      saveProgress();
      renderQuestion();
    } else {
      renderReview();
      show('review');
    }
  });

  $('prev-button').addEventListener('click', function () {
    readCurrentAnswers();
    state.index--;
    saveProgress();
    renderQuestion();
  });

  // ---- 제출 전 확인 ----
  function answerSummary(i) {
    return state.answers[i].map(function (value, j) {
      return QUESTIONS[i].fields[j].type === 'number' ? value + '명' : value;
    }).join(', ');
  }

  function renderReview() {
    var list = $('review-list');
    list.innerHTML = '';
    QUESTIONS.forEach(function (q, i) {
      var li = document.createElement('li');
      li.innerHTML = '<span class="no"></span><span class="ans"></span>';
      li.querySelector('.no').textContent = (i + 1) + '번';
      li.querySelector('.ans').textContent = answerSummary(i);
      var edit = document.createElement('button');
      edit.type = 'button';
      edit.className = 'secondary';
      edit.textContent = '고치기';
      edit.addEventListener('click', function () {
        state.index = i;
        renderQuestion();
        show('quiz');
      });
      li.appendChild(edit);
      list.appendChild(li);
    });
  }

  $('submit-button').addEventListener('click', function () {
    if (!confirm('정말 제출할까요? 제출하면 고칠 수 없어요.')) return;
    $('submit-button').disabled = true;
    $('submit-button').textContent = '제출하는 중...';
    $('submit-error').textContent = '';
    google.script.run
      .withSuccessHandler(function (res) {
        $('submit-button').disabled = false;
        $('submit-button').textContent = '제출하기';
        if (res.alreadySubmitted) {
          $('submit-error').textContent = '이미 제출한 학번이에요. 선생님께 말씀해 주세요.';
          return;
        }
        clearProgress();
        renderResult(res);
        show('result');
      })
      .withFailureHandler(function () {
        $('submit-button').disabled = false;
        $('submit-button').textContent = '제출하기';
        $('submit-error').textContent = '제출에 실패했어요. 잠시 후 다시 눌러 주세요.';
      })
      .submitAnswers({ studentId: state.studentId, name: state.name, answers: state.answers });
  });

  // ---- 결과 ----
  function renderResult(res) {
    $('result-title').textContent = state.name + ' 학생, 수고했어요!';
    $('result-total').textContent = res.total;
    var list = $('result-list');
    list.innerHTML = '';
    res.scores.forEach(function (score, i) {
      var li = document.createElement('li');
      li.innerHTML = '<span class="no"></span><span class="ans"></span><span class="pts"></span>';
      li.querySelector('.no').textContent = (i + 1) + '번';
      li.querySelector('.ans').textContent = '내 답: ' + answerSummary(i);
      if (res.answerTexts) {
        var sub = document.createElement('span');
        sub.className = 'sub';
        sub.textContent = '정답: ' + res.answerTexts[i];
        li.querySelector('.ans').appendChild(sub);
      }
      li.querySelector('.pts').textContent = score + '점';
      list.appendChild(li);
    });
  }
</script>
</body>
</html>
